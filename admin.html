<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Upload | ELE WORK</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-page">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><img
          src="https://i.redd.it/mc7lgfh3rzkh1.png" alt="GM LOGO" /></span><span> ⚡GM
        ELE<span class="brand-light">WORK</span></span></a>
    <nav class="nav-links"><a href="index.html">Home</a></nav>
  </header>
  <main class="admin-wrap">
    <section class="admin-card" id="login-card">
      <p class="eyebrow"><span></span> OWNER ACCESS ONLY</p>
      <h1>Upload Your Project's</h1>
      <p>Only the owner can add or remove photos and videos.</p>
      <form id="login-form"><label>Username<input name="username" required
            autocomplete="username"></label><label>Password<input name="password" type="password" required
            autocomplete="current-password"></label><button class="button primary">Owner login <span>↗</span></button>
        <p class="form-message" id="login-message"></p>
      </form>
    </section>
    <section class="admin-card hidden" id="dashboard">
      <p class="eyebrow"><span></span> OWNER DASHBOARD</p>
      <h1>Add a photo or video</h1>
      <form id="upload-form"><label>Project title<input name="title"
            placeholder="Example: House wiring"></label><label>Category<input name="category"
            placeholder="Example: Residential"></label><label>Photo or video<input name="media" type="file"
            accept="image/*,video/*" required></label><button class="button primary">Upload work <span>↗</span></button>
        <p class="form-message" id="upload-message"></p>
      </form>
      <div id="admin-gallery" class="admin-gallery"></div>
    </section>
    <section class="admin-card hidden" id="partners-dashboard">
      <p class="eyebrow"><span></span> PARTNERS</p>
      <h1>Add a partner</h1>
      <p>Add and remove partners just like your photos and videos.</p>
      <form id="partner-form">
        <label>Partner name<input name="name" placeholder="Example: VoltPro Electricals" required></label>
        <label>Partner type<input name="type" placeholder="Example: Electrical supplier"></label>
        <label>Description<input name="description" placeholder="What does this partner provide?"></label>
        <label>Location<input name="location" placeholder="Example: Chennai, India"></label>
        <label>WhatsApp Number<input type="whatsappnumber" id="whatsappNumber" placeholder="+919999999999"></label>
        <label>Add Partner Image<input name="image" type="file" accept="image/*" required></label>
        <button class="button primary">Add partner
          <span>&#8599;</span></button>
        <p class="form-message" id="partner-message"></p>
      </form>
      <div id="admin-partners" class="admin-gallery"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>

</html>
